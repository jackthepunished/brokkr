[package]
name = "brokkr-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Brokkr worker daemon: leases jobs, executes actions, uploads outputs."

[lints]
workspace = true

[[bin]]
name = "brokkr-worker"
path = "src/main.rs"

[dependencies]
brokkr-cas.workspace = true
brokkr-common.workspace = true
brokkr-proto.workspace = true
brokkr-sandbox.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
prost.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# FUSE input mount (M6b). Linux-only at runtime — the worker binary
# still builds on macOS, but `fuse::mount::mount()` returns
# `Unsupported` there (see `fuse/mod.rs` non-linux stub).
fuser.workspace = true
memmap2.workspace = true
nix.workspace = true

[dev-dependencies]
async-trait.workspace = true
bytes.workspace = true
parking_lot = "0.12"
tempfile.workspace = true
